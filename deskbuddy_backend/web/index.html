<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeskBuddy Control Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: { colors: { accent: '#06b6d4' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'Consolas', 'monospace'] } } }
}
</script>
<style>
:root {
  --bg: #070b14;
  --card-bg: #111a2e;
  --text: #e2e8f0;
  --text-secondary: #94a3b8;
  --border: #25324d;
  --accent: #06b6d4;
  --accent-rgb: 6,182,212;
  --radius: 16px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
::selection { background: rgba(var(--accent-rgb), .35); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(148,163,184,.25); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: rgba(var(--accent-rgb), .5); }

/* ── Ambient animated background ─────────────────────── */
.bg-layer { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.bg-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(148,163,184,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148,163,184,.06) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
}
.orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .35; will-change: transform; }
.orb-1 { width: 520px; height: 520px; background: rgba(var(--accent-rgb), .55); top: -160px; left: -120px; animation: drift1 22s ease-in-out infinite; }
.orb-2 { width: 460px; height: 460px; background: #7c3aed; opacity: .25; bottom: -180px; right: -100px; animation: drift2 28s ease-in-out infinite; }
.orb-3 { width: 340px; height: 340px; background: #ec4899; opacity: .12; top: 40%; left: 55%; animation: drift3 34s ease-in-out infinite; }
@keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(140px,90px) scale(1.15); } }
@keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-160px,-80px) scale(1.1); } }
@keyframes drift3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-120px,100px); } }

/* ── Cards ───────────────────────────────────────────── */
.card {
  position: relative;
  background: color-mix(in srgb, var(--card-bg) 68%, transparent);
  border: 1px solid color-mix(in srgb, var(--border) 75%, transparent);
  border-radius: var(--radius);
  padding: 18px;
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px -12px rgba(0,0,0,.5);
  transition: transform .3s cubic-bezier(.2,.8,.2,1), border-color .3s, box-shadow .3s;
}
.card::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(135deg, rgba(255,255,255,.06), transparent 40%);
}
.card:hover { border-color: rgba(var(--accent-rgb), .35); }
.metric:hover { transform: translateY(-3px); box-shadow: 0 1px 0 rgba(255,255,255,.05) inset, 0 18px 40px -14px rgba(var(--accent-rgb), .35); }

/* ── Buttons ─────────────────────────────────────────── */
.btn {
  position: relative; overflow: hidden;
  padding: 8px 16px; border-radius: 10px; font-weight: 600;
  cursor: pointer; border: 1px solid transparent;
  transition: transform .15s, box-shadow .25s, background .2s, border-color .2s;
}
.btn:active { transform: scale(.95); }
.btn::after {
  content: ''; position: absolute; top: 0; left: -120%; width: 60%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent);
  transform: skewX(-20deg); transition: left .6s;
}
.btn:hover::after { left: 140%; }
.btn-primary {
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #8b5cf6));
  color: #04101a; box-shadow: 0 6px 18px -6px rgba(var(--accent-rgb), .6);
}
.btn-primary:hover { box-shadow: 0 8px 26px -4px rgba(var(--accent-rgb), .8); transform: translateY(-1px); }
.btn-secondary {
  background: rgba(148,163,184,.12); color: var(--text);
  border-color: rgba(148,163,184,.18);
}
.btn-secondary:hover { background: rgba(var(--accent-rgb), .15); border-color: rgba(var(--accent-rgb), .4); transform: translateY(-1px); }
.btn-danger { background: #ef4444; color: white; }

/* ── Form controls ───────────────────────────────────── */
input:not([type=checkbox]):not([type=color]):not([type=range]):not([type=file]), select, textarea {
  background: rgba(15,23,42,.55) !important;
  border: 1px solid rgba(148,163,184,.2) !important;
  border-radius: 10px !important;
  color: var(--text) !important;
  transition: border-color .2s, box-shadow .2s;
  outline: none;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent) !important;
  box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .2);
}
input[type=checkbox], input[type=range] { accent-color: var(--accent); }
input[type=color] { border: none; background: none; padding: 0; }
input[type=file]::file-selector-button {
  background: rgba(var(--accent-rgb), .18); color: var(--accent); border: none;
  padding: 6px 12px; border-radius: 8px; margin-right: 10px; cursor: pointer; font-weight: 600;
  transition: background .2s;
}
input[type=file]::file-selector-button:hover { background: rgba(var(--accent-rgb), .3); }
table th { font-weight: 600; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
tbody tr { transition: background .2s; }
tbody tr:hover { background: rgba(var(--accent-rgb), .06); }

.mono { font-family: 'JetBrains Mono', Consolas, monospace; }
.gradient-text {
  background: linear-gradient(90deg, #fff, var(--accent) 60%, #a78bfa);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  background-size: 200% auto; animation: shine 6s linear infinite;
}
@keyframes shine { to { background-position: 200% center; } }

/* ── Entrance animations ─────────────────────────────── */
@keyframes pageIn { from { opacity: 0; transform: translateY(14px) scale(.995); } to { opacity: 1; transform: none; } }
@keyframes cardIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.page-enter { animation: pageIn .45s cubic-bezier(.2,.8,.2,1) both; }
.stagger > * { animation: cardIn .55s cubic-bezier(.2,.8,.2,1) both; }
.stagger > *:nth-child(1) { animation-delay: .00s; } .stagger > *:nth-child(2) { animation-delay: .06s; }
.stagger > *:nth-child(3) { animation-delay: .12s; } .stagger > *:nth-child(4) { animation-delay: .18s; }
.stagger > *:nth-child(5) { animation-delay: .24s; } .stagger > *:nth-child(6) { animation-delay: .30s; }
.stagger > *:nth-child(7) { animation-delay: .36s; } .stagger > *:nth-child(8) { animation-delay: .42s; }
.stagger > *:nth-child(n+9) { animation-delay: .48s; }

/* ── Sidebar ─────────────────────────────────────────── */
.nav-item {
  position: relative; width: 100%; text-align: left; white-space: nowrap;
  padding: 10px 14px; border-radius: 12px; font-size: .875rem; font-weight: 500;
  display: flex; align-items: center; gap: 10px;
  color: var(--text-secondary);
  transition: color .2s, background .25s, transform .2s;
}
.nav-item:hover { color: var(--text); background: rgba(148,163,184,.08); transform: translateX(3px); }
.nav-item.active {
  color: var(--accent);
  background: linear-gradient(90deg, rgba(var(--accent-rgb), .18), rgba(var(--accent-rgb), .04));
}
.nav-item::before {
  content: ''; position: absolute; left: 0; top: 22%; bottom: 22%; width: 3px; border-radius: 3px;
  background: var(--accent); box-shadow: 0 0 12px var(--accent);
  transform: scaleY(0); transition: transform .3s cubic-bezier(.2,.8,.2,1);
}
.nav-item.active::before { transform: scaleY(1); }
.nav-icon { display: inline-block; transition: transform .3s cubic-bezier(.3,1.6,.5,1); }
.nav-item:hover .nav-icon, .nav-item.active .nav-icon { transform: scale(1.25) rotate(-6deg); }
@media (max-width: 767px) {
  .nav-item::before { top: auto; bottom: 0; left: 20%; right: 20%; width: auto; height: 3px; transform: scaleX(0); }
  .nav-item.active::before { transform: scaleX(1); }
  .nav-item:hover { transform: none; }
}

/* ── Status dot / pulse ──────────────────────────────── */
.pulse-dot { position: relative; width: 10px; height: 10px; border-radius: 50%; }
.pulse-dot.on { background: #22c55e; }
.pulse-dot.on::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%; background: #22c55e;
  animation: ping 1.8s cubic-bezier(0,0,.2,1) infinite;
}
.pulse-dot.off { background: #ef4444; }
@keyframes ping { 75%, 100% { transform: scale(2.8); opacity: 0; } }

/* ── Music ───────────────────────────────────────────── */
.vinyl { animation: spin 10s linear infinite; }
.vinyl.paused { animation-play-state: paused; }
@keyframes spin { to { transform: rotate(360deg); } }
.eq { display: inline-flex; align-items: flex-end; gap: 3px; height: 16px; }
.eq span { width: 3px; height: 100%; background: var(--accent); border-radius: 2px; transform-origin: bottom; animation: eq 1s ease-in-out infinite; }
.eq span:nth-child(2) { animation-delay: .2s; } .eq span:nth-child(3) { animation-delay: .45s; } .eq span:nth-child(4) { animation-delay: .1s; }
.eq.paused span { animation-play-state: paused; transform: scaleY(.25); }
@keyframes eq { 0%,100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
@keyframes lyricIn { from { opacity: 0; transform: translateY(10px) scale(.96); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.lyric-in { animation: lyricIn .45s cubic-bezier(.2,.8,.2,1) both; }

/* ── Toasts ──────────────────────────────────────────── */
@keyframes toastIn { from { opacity: 0; transform: translateX(40px) scale(.95); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }
.toast {
  animation: toastIn .4s cubic-bezier(.2,.8,.2,1) both;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 14px 40px -10px rgba(0,0,0,.6);
}
.toast.leaving { animation: toastOut .3s ease-in both; }
@keyframes bar { from { transform: scaleX(1); } to { transform: scaleX(0); } }

/* ── Misc ────────────────────────────────────────────── */
.chip { transition: transform .2s, background .2s; }
.chip:hover { transform: translateY(-2px); background: rgba(var(--accent-rgb), .15); }
.pop { animation: pop .35s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.float { animation: floaty 4s ease-in-out infinite; }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.wiggle:hover { animation: wiggle .5s; }
@keyframes wiggle { 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="bg-layer"><div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const PROTO = window.location.protocol === "https:" ? "https:" : "http:";
const WS_PROTO = window.location.protocol === "https:" ? "wss:" : "ws:";
const HOST = window.location.host || "127.0.0.1:8080";
const API = `${PROTO}//${HOST}/api/v1`;
const WS_URL = `${WS_PROTO}//${HOST}/ws`;

// ─── API helpers ───────────────────────────────────────────
async function api(path, opts = {}) {
  const res = await fetch(API + path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// Toast helper (replaces alert())
function notify(msg, type) {
  const t = type || (/^(error|.*failed)/i.test(msg) ? 'error' : 'success');
  window.dispatchEvent(new CustomEvent('db-toast', { detail: { msg: String(msg), type: t } }));
}

// ─── WebSocket hook ────────────────────────────────────────
function useWebSocket(onMessage) {
  const wsRef = useRef(null);
  const cbRef = useRef(onMessage);
  cbRef.current = onMessage;
  useEffect(() => {
    const ws = new WebSocket(WS_URL);
    ws.onmessage = (e) => {
      try { const d = JSON.parse(e.data); cbRef.current(d); } catch {}
    };
    ws.onclose = () => setTimeout(() => { wsRef.current = new WebSocket(WS_URL); }, 3000);
    wsRef.current = ws;
    return () => ws.close();
  }, []);
}

// ─── Animated number hook ──────────────────────────────────
function useCountUp(target, duration = 700) {
  const [val, setVal] = useState(typeof target === 'number' && !isNaN(target) ? target : 0);
  const prev = useRef(val);
  useEffect(() => {
    if (typeof target !== 'number' || isNaN(target)) return;
    const from = prev.current, to = target, t0 = performance.now();
    let raf;
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / duration);
      const e = 1 - Math.pow(1 - p, 3);
      const v = from + (to - from) * e;
      prev.current = v; setVal(v);
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return val;
}

// ─── Ring Gauge ────────────────────────────────────────────
function Gauge({ label, value, color }) {
  const has = typeof value === 'number' && !isNaN(value);
  const v = useCountUp(has ? value : 0);
  const R = 34, C = 2 * Math.PI * R;
  const pct = Math.max(0, Math.min(100, v));
  return (
    <div className="card metric flex items-center gap-4">
      <div className="relative w-20 h-20 shrink-0">
        <svg viewBox="0 0 80 80" className="w-full h-full -rotate-90">
          <circle cx="40" cy="40" r={R} stroke="rgba(148,163,184,.15)" strokeWidth="7" fill="none" />
          <circle cx="40" cy="40" r={R} stroke={color} strokeWidth="7" fill="none" strokeLinecap="round"
            strokeDasharray={C} strokeDashoffset={C * (1 - pct / 100)}
            style={{ filter: `drop-shadow(0 0 6px ${color})`, transition: 'stroke .4s' }} />
        </svg>
        <div className="absolute inset-0 flex items-center justify-center text-sm font-bold">
          {has ? Math.round(v) + '%' : '--'}
        </div>
      </div>
      <div>
        <div className="text-xs uppercase tracking-wider text-slate-400 font-semibold">{label}</div>
        <div className="text-xs mt-1" style={{ color }}>{!has ? 'no data' : pct > 80 ? 'High load' : pct > 55 ? 'Moderate' : 'Healthy'}</div>
      </div>
    </div>
  );
}

// ─── Metric Card ───────────────────────────────────────────
function MetricCard({ label, value, unit, color, max }) {
  const has = typeof value === 'number' && !isNaN(value);
  const v = useCountUp(has ? value : 0);
  const pct = max && has ? Math.min(100, (v / max) * 100) : null;
  return (
    <div className="card metric">
      <div className="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">{label}</div>
      <div className="text-2xl font-bold tabular-nums" style={{ color: color || '#e2e8f0' }}>
        {has ? v.toFixed(1) : (value !== null && value !== undefined ? value : '--')}
        <span className="text-sm text-slate-500 ml-1 font-medium">{unit}</span>
      </div>
      {pct !== null && (
        <div className="mt-2 h-1.5 bg-slate-700/60 rounded-full overflow-hidden">
          <div className="h-full rounded-full" style={{ width: pct + '%', background: `linear-gradient(90deg, ${color || '#06b6d4'}, ${color || '#06b6d4'}aa)`, boxShadow: `0 0 10px ${color || '#06b6d4'}`, transition: 'width .6s cubic-bezier(.2,.8,.2,1)' }}></div>
        </div>
      )}
    </div>
  );
}

// ─── Dashboard ─────────────────────────────────────────────
const loadColor = (v, hi = 80, mid = 55) => v > hi ? '#ef4444' : v > mid ? '#f59e0b' : '#22c55e';

function Dashboard({ state, metrics, setState, refreshState }) {
  const m = metrics || {};
  const s = state || {};
  const fmt = (n) => Math.floor(n / 60) + ':' + ('0' + (n % 60)).slice(-2);
  const pct = s.m_dur > 0 ? Math.min(100, (s.m_prog / s.m_dur) * 100) : 0;
  const musicCall = async (path) => { try { await api(path, { method: 'POST' }); setTimeout(refreshState, 500); } catch (e) { notify('Error: ' + e.message, 'error'); } };
  const togglePlay = async () => {
    try {
      if (s.m_play) { await api('/desktop/music/pause', { method: 'POST' }); setState(prev => ({ ...prev, m_play: 0 })); }
      else { await api('/desktop/music/play', { method: 'POST' }); setState(prev => ({ ...prev, m_play: 1 })); }
      setTimeout(refreshState, 500);
    } catch (e) { notify('Error: ' + e.message, 'error'); }
  };
  return (
    <div className="space-y-4 stagger">
      <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
        <Gauge label="CPU" value={m.cpu_percent} color={loadColor(m.cpu_percent)} />
        <Gauge label="RAM" value={m.memory_percent} color={loadColor(m.memory_percent, 85, 65)} />
        <Gauge label="GPU" value={m.gpu_percent} color={loadColor(m.gpu_percent)} />
        <Gauge label="VRAM" value={m.gpu_memory_percent} color={m.gpu_memory_percent > 90 ? '#ef4444' : '#06b6d4'} />
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <MetricCard label="CPU Temp" value={m.cpu_temp_c} unit="°C" color="#f97316" />
        <MetricCard label="GPU Temp" value={m.gpu_temp_c} unit="°C" color="#fb7185" />
        <MetricCard label="Thermal Zone" value={m.thermal_zone_c} unit="°C" color="#a78bfa" />
        <MetricCard label="GPU Fan" value={m.gpu_fan_percent} unit="%" color="#06b6d4" max={100} />
      </div>
      <div className="card">
        <div className="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-3">Device Status</div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-sm">
          <div className="chip rounded-xl bg-slate-700/30 px-3 py-2"><div className="text-xs text-slate-400">Online</div><div className={'font-semibold ' + (s.dev_online ? 'text-green-400' : 'text-red-400')}>{s.dev_online ? 'Yes' : 'No'}</div></div>
          <div className="chip rounded-xl bg-slate-700/30 px-3 py-2"><div className="text-xs text-slate-400">Battery</div><div className="font-semibold">{s.batt_v ? s.batt_v.toFixed(2) + 'V' : '--'} <span className="text-slate-400 font-normal">({s.batt >= 0 ? s.batt + '%' : 'N/A'})</span></div></div>
          <div className="chip rounded-xl bg-slate-700/30 px-3 py-2"><div className="text-xs text-slate-400">Mic</div><div className="font-semibold">{s.mic >= 0 ? s.mic + '/100' : 'offline'}</div></div>
          <div className="chip rounded-xl bg-slate-700/30 px-3 py-2"><div className="text-xs text-slate-400">Env</div><div className="font-semibold">{s.env_t > -900 ? s.env_t.toFixed(1) + '°C' : '--'}</div></div>
        </div>
      </div>
      <div className="card relative overflow-hidden">
        {s.m_art && (
          <div
            className="absolute inset-0 bg-cover bg-center opacity-30 pointer-events-none transition-all duration-1000"
            style={{ backgroundImage: `url(${s.m_art})`, filter: 'blur(40px) brightness(0.7) saturate(1.4)', transform: 'scale(1.3)' }}
          />
        )}
        <div className="relative z-10 flex flex-col md:flex-row gap-4 items-start md:items-center justify-between">
          <div className="flex items-center gap-4">
            <div className="relative shrink-0">
              {s.m_art ? (
                <img src={s.m_art} alt="Cover" className={'w-20 h-20 rounded-full object-cover shadow-2xl border-2 border-slate-600/60 vinyl ' + (s.m_play ? '' : 'paused')} />
              ) : (
                <div className="w-20 h-20 rounded-full bg-slate-800/80 border border-slate-700 flex items-center justify-center text-3xl text-cyan-400 shadow float">♪</div>
              )}
              <div className="absolute inset-0 m-auto w-4 h-4 rounded-full" style={{ background: 'var(--bg)', boxShadow: '0 0 0 2px rgba(255,255,255,.15)' }}></div>
            </div>
            <div>
              <div className="flex items-center gap-2 text-xs uppercase tracking-wider text-slate-400 font-semibold mb-0.5">
                Now Playing
                <span className={'eq ' + (s.m_play ? '' : 'paused')}><span></span><span></span><span></span><span></span></span>
              </div>
              <div key={s.m_title} className="text-lg font-bold text-cyan-400 leading-tight lyric-in">{s.m_title || 'Nothing playing'}</div>
              <div className="text-slate-300 text-sm">{s.m_artist || 'Start music on PC or YouTube Music'}</div>
              {s.m_dur > 0 && (
                <div className="mt-2 w-56 max-w-full">
                  <div className="h-1.5 bg-slate-700/60 rounded-full overflow-hidden">
                    <div className="h-full rounded-full" style={{ width: pct + '%', background: 'linear-gradient(90deg, var(--accent), #a78bfa)', transition: 'width 1s linear', boxShadow: '0 0 10px var(--accent)' }}></div>
                  </div>
                  <div className="flex justify-between text-[11px] text-slate-400 mt-1 tabular-nums"><span>{fmt(s.m_prog)}</span><span>{fmt(s.m_dur)}</span></div>
                </div>
              )}
            </div>
          </div>
          <div className="flex gap-2 items-center">
            <button className="btn btn-secondary text-xs" onClick={() => musicCall('/desktop/music/previous')}>⏮ Prev</button>
            <button className="btn btn-primary text-xs" onClick={togglePlay}>{s.m_play ? '⏸ Pause' : '▶ Play'}</button>
            <button className="btn btn-secondary text-xs" onClick={() => musicCall('/desktop/music/next')}>Next ⏭</button>
          </div>
        </div>
        {s.lyr_ok && (
          <div className="relative z-10 mt-4 pt-3 border-t border-slate-700/50">
            <div className="flex items-center justify-between text-xs text-slate-400 mb-2">
              <span className={`px-2 py-0.5 rounded-full text-[10px] font-semibold ${s.lyr_sync ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'}`}>
                {s.lyr_sync ? 'SYNCED' : 'UNSYNCED'}
              </span>
              {s.lyr_tot > 0 && <span className="tabular-nums">{s.lyr_idx + 1} / {s.lyr_tot}</span>}
            </div>
            <div className="text-center space-y-1.5 py-1">
              {s.lyr_prev && <div className="text-xs text-slate-400 opacity-50">{s.lyr_prev}</div>}
              <div key={s.lyr_cur} className="text-lg font-bold text-cyan-300 py-1 lyric-in" style={{ textShadow: '0 0 24px rgba(var(--accent-rgb), .6)' }}>{s.lyr_cur || '...'}</div>
              {s.lyr_next && <div className="text-xs text-slate-400 opacity-50">{s.lyr_next}</div>}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Expressions ───────────────────────────────────────────
const EXPRESSIONS = ["relaxed","happy","sad","angry","sleepy","thinking","curious","excited","surprised","confused","laughing","music","typing","coding","browsing","gaming","watching","sleeping","deep_sleep","autonomous"];
const ACTIVITIES = ["idle","coding","browsing","music","gaming","watching","typing","thinking","gaming"];

function SectionHeader({ title, sub }) {
  return (
    <div>
      <h2 className="text-2xl font-extrabold tracking-tight gradient-text inline-block">{title}</h2>
      {sub && <p className="text-slate-400 text-sm mt-1">{sub}</p>}
    </div>
  );
}

function Expressions() {
  const [mappings, setMappings] = useState({});
  const [activities, setActivities] = useState([...new Set(ACTIVITIES)]);
  const [expressions, setExpressions] = useState(EXPRESSIONS);
  const [thresholds, setThresholds] = useState({ sleepy_seconds: 30, sleep_seconds: 120, deep_sleep_seconds: 300 });
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    api('/config/expressions').then(d => {
      const map = {};
      (d.mappings || []).forEach(m => { map[m.activity] = m.expression; });
      setMappings(map);
      if (Array.isArray(d.activities) && d.activities.length) setActivities([...new Set(d.activities)]);
      if (Array.isArray(d.expressions) && d.expressions.length) setExpressions([...new Set([...d.expressions, ...EXPRESSIONS])]);
    }).catch(() => {}).finally(() => setLoading(false));
    api('/companion/thresholds').then(t => setThresholds(prev => ({...prev, ...t}))).catch(() => {});
  }, []);

  const saveMappings = async () => {
    try {
      const payload = activities.map(a => ({ activity: a, expression: mappings[a] || a }));
      await api('/config/expressions', {method:'PUT', body: JSON.stringify(payload)});
      await api('/companion/thresholds', {method:'PUT', body: JSON.stringify(thresholds)});
      notify('Expression mappings saved & applied');
    } catch(e) { notify('Error: ' + e.message, 'error'); }
  };
  return (
    <div className="space-y-4 stagger">
      <SectionHeader title="Expression Mappings" sub="Map PC activities to OLED face expressions." />
      <div className="card">
        <table className="w-full text-sm">
          <thead><tr className="text-slate-400"><th className="text-left py-2">Activity</th><th className="text-left py-2">Expression</th><th className="text-left py-2">Actions</th></tr></thead>
          <tbody>
            {activities.map(act => (
              <tr key={act} className="border-t border-slate-700/60">
                <td className="py-2 font-mono">{act}</td>
                <td className="py-2">
                  <select className="px-2 py-1" value={mappings[act] || act}
                    onChange={e => setMappings(m => ({...m, [act]: e.target.value}))}>
                    {expressions.map(e => <option key={e} value={e}>{e}</option>)}
                  </select>
                </td>
                <td className="py-2">
                  <button className="btn btn-secondary text-xs" onClick={() => {
                    const expr = mappings[act] || 'happy';
                    api('/companion/emotion', {method:'POST', body: JSON.stringify({expression: expr, duration_seconds: 5})}).then(() => notify('Expression "' + expr + '" sent for 5s')).catch(err => notify('Error: ' + err.message, 'error'));
                  }}>Test</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <button className="btn btn-primary" onClick={saveMappings}>Save Mappings</button>
      <div className="card">
        <h3 className="font-semibold mb-3">Sleep Thresholds (seconds)</h3>
        <div className="grid grid-cols-3 gap-3 text-sm">
          <div><label className="text-slate-400">Sleepy</label><input type="number" min="1" className="px-2 py-1 w-full" value={thresholds.sleepy_seconds} onChange={e => setThresholds(t => ({...t, sleepy_seconds: parseInt(e.target.value || '0')}))} /></div>
          <div><label className="text-slate-400">Sleeping</label><input type="number" min="1" className="px-2 py-1 w-full" value={thresholds.sleep_seconds} onChange={e => setThresholds(t => ({...t, sleep_seconds: parseInt(e.target.value || '0')}))} /></div>
          <div><label className="text-slate-400">Deep Sleep</label><input type="number" min="1" className="px-2 py-1 w-full" value={thresholds.deep_sleep_seconds} onChange={e => setThresholds(t => ({...t, deep_sleep_seconds: parseInt(e.target.value || '0')}))} /></div>
        </div>
      </div>
    </div>
  );
}

// ─── Button Mappings ──────────────────────────────────────
const BUTTONS = ["mode", "voice", "up", "down", "select"];
const PAGES = ["home", "music", "lyrics", "pc", "env", "notifications", "pomodoro"];
const ACTIONS = ["next_page", "prev_page", "play_pause", "volume_up", "volume_down", "toggle_mode", "voice_request", "none"];

function ButtonMappings() {
  const [meta, setMeta] = useState({ buttons: BUTTONS, pages: PAGES, actions: ACTIONS });
  const [map, setMap] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    api('/config/buttons').then(d => {
      setMeta({ buttons: d.buttons || BUTTONS, pages: d.pages || PAGES, actions: d.actions || ACTIONS });
      setMap(Array.isArray(d.map) ? d.map : []);
    }).catch(() => {}).finally(() => setLoading(false));
  }, []);

  const setCell = (b, p, value) => setMap(prev => {
    const next = prev.map(row => row.slice());
    while (next.length <= b) next.push([]);
    const row = next[b];
    while (row.length <= p) row.push(0);
    row[p] = parseInt(value, 10) || 0;
    return next;
  });

  const saveMappings = async () => {
    try {
      await api('/config/buttons', { method: 'PUT', body: JSON.stringify({ map }) });
      notify('Button map saved & pushed to device');
    } catch (e) { notify('Error: ' + e.message, 'error'); }
  };

  const resetDefaults = () => setMap([5, 6, 1, 0, 8].map(v => Array(meta.pages.length).fill(v)));

  return (
    <div className="space-y-4 stagger">
      <SectionHeader title="Button Mappings" sub="Edit what each button does on each page. Saving pushes the map to the ESP32." />
      <div className="card overflow-x-auto">
        {loading && <p className="text-slate-500 text-sm">Loading map...</p>}
        <table className="w-full text-sm">
          <thead><tr className="text-slate-400">
            <th className="text-left py-2">Button</th>
            {meta.pages.map(p => <th key={p} className="text-left py-2 px-2">{p}</th>)}
          </tr></thead>
          <tbody>
            {meta.buttons.map((btn, b) => (
              <tr key={btn} className="border-t border-slate-700/60">
                <td className="py-2 font-mono font-bold">{btn}</td>
                {meta.pages.map((p, pi) => (
                  <td key={p} className="py-2 px-2">
                    <select className="px-1 py-1 text-xs" value={map[b]?.[pi] ?? 0}
                      onChange={e => setCell(b, pi, e.target.value)}>
                      {meta.actions.map((a, ai) => <option key={a} value={ai}>{a}</option>)}
                    </select>
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="flex flex-wrap gap-2">
        <button className="btn btn-primary" onClick={saveMappings}>Save & Push to Device</button>
        <button className="btn btn-secondary" onClick={resetDefaults}>Reset defaults</button>
      </div>
      <div className="card">
        <h3 className="font-semibold mb-3">Gesture Config</h3>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
          <label className="flex items-center gap-2"><input type="checkbox" defaultChecked /> Single tap → Wake</label>
          <label className="flex items-center gap-2"><input type="checkbox" defaultChecked /> Double tap → Music</label>
          <label className="flex items-center gap-2"><input type="checkbox" defaultChecked /> Triple tap → Voice</label>
          <label className="flex items-center gap-2"><input type="checkbox" defaultChecked /> Shake → Home</label>
        </div>
      </div>
    </div>
  );
}

// ─── Notifications ────────────────────────────────────────
function Notifications() {
  const [notifs, setNotifs] = useState([]);
  const [rules, setRules] = useState([]);
  const [metrics, setMetrics] = useState([]);
  const [draft, setDraft] = useState({ metric: 'cpu', op: '>', threshold: 80, name: 'High CPU', title: 'High CPU', message: '{metric} is {value}', priority: 'high', cooldown: 300, enabled: true });

  const loadHistory = () => api('/desktop/notifications?limit=50').then(d => setNotifs(d.notifications || [])).catch(() => {});
  const loadRules = () => api('/config/notification-rules')
    .then(d => { setRules(d.rules || []); setMetrics(d.metrics || []); })
    .catch(() => {});

  useEffect(() => { loadHistory(); loadRules(); }, []);

  const updateRule = async (id, patch) => {
    try {
      const d = await api('/config/notification-rules/' + id, { method: 'PUT', body: JSON.stringify(patch) });
      setRules(d.rules || []);
    } catch (e) { notify('Error: ' + e.message, 'error'); }
  };
  const addRule = async () => {
    try {
      const d = await api('/config/notification-rules', { method: 'POST', body: JSON.stringify(draft) });
      setRules(d.rules || []);
      notify('Rule created');
    } catch (e) { notify('Error: ' + e.message, 'error'); }
  };
  const deleteRule = async (id) => {
    try {
      const d = await api('/config/notification-rules/' + id, { method: 'DELETE' });
      setRules(d.rules || []);
      notify('Rule deleted');
    } catch (e) { notify('Error: ' + e.message, 'error'); }
  };
  const testRule = async (id) => {
    try {
      await api('/config/notification-rules/' + id + '/test', { method: 'POST' });
      notify('Test notification sent');
      setTimeout(loadHistory, 400);
    } catch (e) { notify('Error: ' + e.message, 'error'); }
  };

  const ops = ['>', '>=', '<', '<=', '==', '!='];
  const priorities = ['low', 'normal', 'high', 'urgent'];

  return (
    <div className="space-y-4 stagger">
      <SectionHeader title="Notifications" sub="Rules are saved, evaluated every 5 s and shown on the device." />
      <div className="card">
        <h3 className="font-semibold mb-1">Notification Rules</h3>
        <p className="text-slate-400 text-sm mb-3">IF condition THEN send notification</p>
        <div className="space-y-2">
          {rules.length === 0 && <p className="text-slate-500 text-sm">No rules yet — add one below.</p>}
          {rules.map(r => (
            <div key={r.id} className="flex flex-wrap gap-2 items-center text-sm border-t border-slate-700/50 pt-2">
              <label className="flex items-center gap-1 text-xs text-slate-400">
                <input type="checkbox" checked={!!r.enabled} onChange={e => updateRule(r.id, { enabled: e.target.checked })} /> on
              </label>
              <span className="text-cyan-400 font-bold">IF</span>
              <select className="px-2 py-1 text-xs" value={r.metric} onChange={e => updateRule(r.id, { metric: e.target.value })}>
                {metrics.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
              </select>
              <select className="px-1 py-1 text-xs" value={r.op} onChange={e => updateRule(r.id, { op: e.target.value })}>
                {ops.map(o => <option key={o} value={o}>{o}</option>)}
              </select>
              <input type="number" className="px-2 py-1 w-20 text-xs" defaultValue={r.threshold}
                onBlur={e => updateRule(r.id, { threshold: parseFloat(e.target.value) })} />
              <span className="text-cyan-400 font-bold">THEN</span>
              <input className="px-2 py-1 text-xs flex-1 min-w-[8rem]" defaultValue={r.title}
                onBlur={e => updateRule(r.id, { title: e.target.value })} />
              <select className="px-2 py-1 text-xs" value={r.priority} onChange={e => updateRule(r.id, { priority: e.target.value })}>
                {priorities.map(p => <option key={p} value={p}>{p}</option>)}
              </select>
              <button className="btn btn-secondary text-xs" onClick={() => testRule(r.id)}>Test</button>
              <button className="btn btn-secondary text-xs" onClick={() => deleteRule(r.id)}>Delete</button>
            </div>
          ))}
        </div>
        <div className="flex flex-wrap gap-2 items-center text-sm border-t border-slate-700/50 mt-3 pt-3">
          <span className="text-cyan-400 font-bold">IF</span>
          <select className="px-2 py-1 text-xs" value={draft.metric} onChange={e => setDraft({ ...draft, metric: e.target.value, name: e.target.value })}>
            {metrics.length
              ? metrics.map(m => <option key={m.id} value={m.id}>{m.label}</option>)
              : <option value="cpu">CPU %</option>}
          </select>
          <select className="px-1 py-1 text-xs" value={draft.op} onChange={e => setDraft({ ...draft, op: e.target.value })}>
            {ops.map(o => <option key={o} value={o}>{o}</option>)}
          </select>
          <input type="number" className="px-2 py-1 w-20 text-xs" value={draft.threshold}
            onChange={e => setDraft({ ...draft, threshold: parseFloat(e.target.value || '0') })} />
          <span className="text-cyan-400 font-bold">THEN</span>
          <input className="px-2 py-1 text-xs flex-1 min-w-[8rem]" value={draft.title}
            onChange={e => setDraft({ ...draft, title: e.target.value, name: e.target.value })} />
          <select className="px-2 py-1 text-xs" value={draft.priority} onChange={e => setDraft({ ...draft, priority: e.target.value })}>
            {priorities.map(p => <option key={p} value={p}>{p}</option>)}
          </select>
          <button className="btn btn-primary text-xs" onClick={addRule}>Add Rule</button>
        </div>
        <p className="text-slate-500 text-xs mt-2">Message template supports {'{metric}'}, {'{value}'} and {'{threshold}'}.</p>
      </div>
      <div className="card">
        <h3 className="font-semibold mb-2">History</h3>
        <div className="space-y-1 max-h-72 overflow-y-auto pr-1">
          {notifs.length === 0 && <p className="text-slate-500 text-sm">No notifications yet.</p>}
          {notifs.map((n, i) => (
            <div key={i} className="flex justify-between items-center text-sm border-b border-slate-700/50 py-2 lyric-in" style={{ animationDelay: Math.min(i, 12) * 30 + 'ms' }}>
              <div>
                <div className="font-semibold">{n.title || 'Notification'}</div>
                <div className="text-slate-400 text-xs">{n.message}</div>
              </div>
              <span className={`text-xs px-2 py-1 rounded-full ${n.priority === 'urgent' ? 'bg-red-500/20 text-red-400' : n.priority === 'high' ? 'bg-amber-500/20 text-amber-400' : 'bg-slate-500/20 text-slate-400'}`}>{n.priority || 'normal'}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── Sensor Graphs ────────────────────────────────────────
function SensorGraphs() {
  const chartRef = useRef(null);
  const chartInstance = useRef(null);
  const [range, setRange] = useState('1h');
  const [metrics, setMetrics] = useState([]);

  useEffect(() => {
    api('/system/metrics?limit=60').then(d => setMetrics(d.metrics || d || [])).catch(() => {});
  }, [range]);

  useEffect(() => {
    if (!chartRef.current) return;
    if (chartInstance.current) chartInstance.current.destroy();
    const ctx = chartRef.current.getContext('2d');
    const grad = (c) => { const g = ctx.createLinearGradient(0, 0, 0, 260); g.addColorStop(0, c + '55'); g.addColorStop(1, c + '00'); return g; };
    const labels = (Array.isArray(metrics) ? metrics : []).map((_, i) => i);
    const list = Array.isArray(metrics) ? metrics : [];
    const ds = (label, key, c) => ({ label, data: list.map(m => m[key]), borderColor: c, backgroundColor: grad(c), fill: true, borderWidth: 2, tension: 0.4, pointRadius: 0, pointHoverRadius: 5 });
    chartInstance.current = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets: [ds('CPU %', 'cpu_percent', '#22c55e'), ds('RAM %', 'memory_percent', '#06b6d4'), ds('GPU %', 'gpu_percent', '#a78bfa')] },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        animation: { duration: 900, easing: 'easeOutQuart' },
        plugins: { legend: { labels: { color: '#94a3b8', usePointStyle: true, boxWidth: 8 } }, tooltip: { backgroundColor: 'rgba(15,23,42,.95)', borderColor: 'rgba(148,163,184,.25)', borderWidth: 1, padding: 10 } },
        scales: { x: { display: false }, y: { min: 0, max: 100, ticks: { color: '#94a3b8' }, grid: { color: 'rgba(148,163,184,.08)' } } }
      }
    });
    return () => { if (chartInstance.current) chartInstance.current.destroy(); };
  }, [metrics]);

  return (
    <div className="space-y-4 stagger">
      <SectionHeader title="Sensor Graphs & Historical Metrics" />
      <div className="flex gap-2">
        {['1h','6h','24h','7d'].map(r => <button key={r} className={`btn text-xs ${range===r?'btn-primary':'btn-secondary'}`} onClick={() => setRange(r)}>{r}</button>)}
      </div>
      <div className="card"><canvas ref={chartRef} height="200"></canvas></div>
      <div className="card">
        <h3 className="font-semibold mb-2">Device Sensor History</h3>
        <p className="text-slate-400 text-sm">Temperature, humidity, pressure, mic level over time.</p>
      </div>
    </div>
  );
}

        <h3 className="font-semibold mb-2">Active Classification Model</h3>
        <div className="text-sm text-slate-400">1D-CNN trained on CWRU Bearing Dataset — 4 classes: Normal, Inner Race, Ball, Outer Race</div>
        <div className="text-sm text-slate-400">Window: 1200 samples @ 12000 Hz | Test accuracy: 100%</div>
        <div className="text-sm text-green-400 mt-2 flex items-center gap-2"><span className="pulse-dot on"></span> Status: Loaded & active</div>
      </div>
      <div className="card">
        <h3 className="font-semibold mb-2">Upload New Model</h3>
        <input type="file" accept=".pth,.pt,.onnx" className="text-sm" id="modelFile" />
        <button className="btn btn-secondary text-xs mt-3" onClick={async () => {
          const file = document.getElementById('modelFile').files[0];
          if (!file) { notify('Select a file first', 'error'); return; }
          try { await fetch(API + '/inspect/vibration', {method:'POST', body: JSON.stringify({device_id:'test', x:[1,2,3], y:[1,2,3], z:[1,2,3], sample_rate_hz:1000, method:'traditional', duration_seconds:1}), headers:{'Content-Type':'application/json'}}); notify('Upload not yet implemented - use models/ folder', 'error'); } catch(e) { notify('Error: ' + e.message, 'error'); }
        }}>Upload</button>
      </div>
      <div className="card">
        <h3 className="font-semibold mb-2">Test Analysis</h3>
        <textarea className="p-2 w-full text-xs mono" rows={4} placeholder="Paste vibration data (JSON array)..." />
        <button className="btn btn-primary text-xs mt-3" onClick={async () => {
          try {
            // Build 500-sample test signals (the original `[...]*100` evaluated to NaN)
            const rep = (arr) => Array.from({ length: 500 }, (_, i) => arr[i % arr.length]);
            const r = await api('/inspect/vibration', {method:'POST', body: JSON.stringify({device_id:'test', x:rep([0.1,0.2,0.15,0.12,0.18]), y:rep([0.05,0.08,0.06,0.07,0.09]), z:rep([9.8,9.81,9.79,9.82,9.78]), sample_rate_hz:1000, method:'cnn', duration_seconds:5})});
            notify('Result: ' + r.predicted_class + ' (confidence: ' + (r.confidence*100).toFixed(1) + '%)');
          } catch(e) { notify('Error: ' + e.message, 'error'); }
        }}>Run Analysis</button>
      </div>
    </div>
  );
}

// ─── Toggle switch ────────────────────────────────────────

      style={{ background: on ? 'linear-gradient(135deg, var(--accent), #8b5cf6)' : 'rgba(148,163,184,.25)', boxShadow: on ? '0 0 18px rgba(var(--accent-rgb), .5)' : 'none', transition: 'all .3s' }}>

  );
}

// ─── Gaming Mode ──────────────────────────────────────────
function GamingMode() {
  const [status, setStatus] = useState(null);
  const [config, setConfig] = useState({ enabled: false, auto_detect: true, gpu_threshold: 30, cpu_threshold: 25, sustained_seconds: 10, fullscreen_detection: true, gpu_temp_threshold: 80, cpu_temp_threshold: 85, vram_threshold: 90, game_library: [] });
  const [newGame, setNewGame] = useState('');

  useEffect(() => {
    api('/gaming/status').then(d => { setStatus(d); if (d.config) setConfig(c => ({...c, ...d.config})); }).catch(() => {});
  }, []);

  const toggleEnabled = () => {
    const newState = !config.enabled;
    setConfig(c => ({...c, enabled: newState}));
    api(newState ? '/gaming/enable' : '/gaming/disable', {method:'POST'}).catch(() => {});
  };

  const addGame = () => {
    if (!newGame.trim()) return;
    api('/gaming/library/add', {method:'POST', body: JSON.stringify({games: [newGame.trim()]})}).then(d => {
      setConfig(c => ({...c, game_library: d.library || []}));
      setNewGame('');
    }).catch(() => {});
  };

  const removeGame = (g) => {
    api('/gaming/library/remove', {method:'POST', body: JSON.stringify({games: [g]})}).then(d => {
      setConfig(c => ({...c, game_library: d.library || []}));
    }).catch(() => {});
  };

  return (
    <div className="space-y-4 stagger">
      <SectionHeader title="Gaming Mode" />
      <div className="card flex items-center justify-between">
        <div>
          <div className="font-semibold">Gaming Mode</div>
          <div className="text-sm text-slate-400">Auto-detect games, track sessions, monitor temps</div>
        </div>
        <Switch on={config.enabled} onClick={toggleEnabled} />
      </div>

      {status && status.active && status.session && (
        <div className="card pop" style={{ borderColor: 'rgba(34,197,94,.4)', boxShadow: '0 0 40px -10px rgba(34,197,94,.35)' }}>
          <div className="flex justify-between items-center">
            <div>
              <div className="text-lg font-bold text-green-400">{status.session.game_name}</div>
              <div className="text-sm text-slate-400 flex items-center gap-2"><span className="pulse-dot on"></span> Session active</div>
            </div>
            <div className="text-2xl font-bold mono">{status.session.started_at ? new Date(status.session.started_at).toLocaleTimeString() : '--'}</div>
          </div>
          {status.session.current_stats && (
            <div className="grid grid-cols-3 gap-2 mt-3 text-sm">
              <div>GPU: {status.session.current_stats.gpu_percent?.toFixed(0)}%</div>
              <div>CPU: {status.session.current_stats.cpu_percent?.toFixed(0)}%</div>
              <div>VRAM: {status.session.current_stats.vram_percent?.toFixed(0)}%</div>
              <div>GPU Temp: {status.session.current_stats.gpu_temp?.toFixed(0)}°C</div>
              <div>CPU Temp: {status.session.current_stats.cpu_temp?.toFixed(0)}°C</div>
            </div>
          )}
        </div>
      )}

      <div className="card">
        <h3 className="font-semibold mb-3">Detection Settings</h3>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
          <label className="flex items-center gap-2"><input type="checkbox" checked={config.auto_detect} onChange={e => setConfig(c=>({...c, auto_detect: e.target.checked}))} /> Auto-detect games</label>
          <label className="flex items-center gap-2"><input type="checkbox" checked={config.fullscreen_detection} onChange={e => setConfig(c=>({...c, fullscreen_detection: e.target.checked}))} /> Fullscreen detection</label>
          <div><label className="text-slate-400">GPU threshold %</label><input type="number" className="px-2 py-1 w-full" value={config.gpu_threshold} onChange={e => setConfig(c=>({...c, gpu_threshold: +e.target.value}))} /></div>
          <div><label className="text-slate-400">CPU threshold %</label><input type="number" className="px-2 py-1 w-full" value={config.cpu_threshold} onChange={e => setConfig(c=>({...c, cpu_threshold: +e.target.value}))} /></div>
          <div><label className="text-slate-400">Sustained (seconds)</label><input type="number" className="px-2 py-1 w-full" value={config.sustained_seconds} onChange={e => setConfig(c=>({...c, sustained_seconds: +e.target.value}))} /></div>
        </div>
        <button className="btn btn-primary text-xs mt-3" onClick={() => api('/gaming/config', {method:'POST', body: JSON.stringify(config)}).then(() => notify('Gaming config saved')).catch(e => notify('Error: ' + e.message, 'error'))}>Save Config</button>
      </div>

      <div className="card">
        <h3 className="font-semibold mb-2">Game Library (manual)</h3>
        <p className="text-slate-400 text-sm mb-2">Add game .exe names for instant detection (pirated games included).</p>
        <div className="flex gap-2 mb-3">
          <input className="px-3 py-1.5 flex-1 text-sm" placeholder="e.g. eldenring.exe" value={newGame} onChange={e => setNewGame(e.target.value)} onKeyDown={e => e.key === 'Enter' && addGame()} />
          <button className="btn btn-primary text-xs" onClick={addGame}>Add</button>
        </div>
        <div className="flex flex-wrap gap-2">
          {(config.game_library || []).map(g => (
            <span key={g} className="pop chip rounded-full px-3 py-1 text-xs flex items-center gap-2" style={{ background: 'rgba(var(--accent-rgb), .12)', border: '1px solid rgba(var(--accent-rgb), .25)' }}>

      <div className="card">
        <h3 className="font-semibold mb-3">Alert Thresholds</h3>

          <div><label className="text-slate-400">CPU Temp (°C)</label><input type="number" className="px-2 py-1 w-full" value={config.cpu_temp_threshold} onChange={e => setConfig(c=>({...c, cpu_temp_threshold: +e.target.value}))} /></div>
          <div><label className="text-slate-400">VRAM (%)</label><input type="number" className="px-2 py-1 w-full" value={config.vram_threshold} onChange={e => setConfig(c=>({...c, vram_threshold: +e.target.value}))} /></div>
        </div>
        <button className="btn btn-primary text-xs mt-3" onClick={() => api('/gaming/alerts', {method:'PUT', body: JSON.stringify({gpu_temp_threshold: config.gpu_temp_threshold, cpu_temp_threshold: config.cpu_temp_threshold, vram_threshold: config.vram_threshold})}).then(() => notify('Alert thresholds saved')).catch(e => notify('Error: ' + e.message, 'error'))}>Save Alerts</button>
      </div>

      {status && status.alerts && status.alerts.length > 0 && (
        <div className="card">
          <h3 className="font-semibold mb-2">Recent Alerts</h3>
          <div className="space-y-1 text-sm">
            {status.alerts.map((a, i) => (
              <div key={i} className="text-amber-400">{a.type}: {a.value?.toFixed(1)} (threshold: {a.threshold})</div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Theme Editor ─────────────────────────────────────────
function ThemeEditor() {
  const [theme, setTheme] = useState(null);
  const [presets, setPresets] = useState([]);
  const [wallpaperPreview, setWallpaperPreview] = useState('');

  useEffect(() => {
    api('/config/theme').then(d => { setTheme(d); window.applyTheme(d); }).catch(() => {});
    api('/config/theme/presets').then(d => setPresets(d.presets || [])).catch(() => {});
  }, []);

  const applyPreset = (preset) => {
    const newTheme = {
      ...theme,
      preset: preset.id,
      accent_color: preset.accent,
      background: preset.bg,
      card_bg: preset.card,
      text_color: preset.text,
    };
    setTheme(newTheme);
    window.applyTheme(newTheme);
    api('/config/theme', {method:'PUT', body: JSON.stringify(newTheme)}).then(() => {}).catch(e => notify('Error: ' + e.message, 'error'));
  };

  const updateField = (key, value) => {
    setTheme(prev => {
      const updated = {...prev, [key]: value};
      window.applyTheme(updated);
      return updated;
    });
  };

  const saveTheme = () => {
    window.applyTheme(theme);
    api('/config/theme', {method:'PUT', body: JSON.stringify(theme)}).then(() => notify('Theme saved!')).catch(e => notify('Error: ' + e.message, 'error'));
  };

  const handleWallpaper = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      setWallpaperPreview(ev.target.result);
      updateField('wallpaper', ev.target.result);
    };
    reader.readAsDataURL(file);
  };

  if (!theme) return <div className="text-slate-400 flex items-center gap-2"><span className="pulse-dot on"></span> Loading theme...</div>;

  return (
    <div className="space-y-4 stagger">
      <SectionHeader title="Visual Theme Editor" sub="Customize color schemes, wallpapers, and text sizes." />

      <div className="card">
        <h3 className="font-semibold mb-3">Color Presets</h3>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
          {presets.map(p => (
            <button key={p.id} onClick={() => applyPreset(p)}
              className="p-3 rounded-xl border-2 text-left"
              style={{ background: p.bg, color: p.text, borderColor: theme.preset === p.id ? p.accent : 'rgba(148,163,184,.25)', boxShadow: theme.preset === p.id ? `0 0 22px -4px ${p.accent}` : 'none', transition: 'transform .2s, box-shadow .3s, border-color .3s' }}
              onMouseEnter={e => e.currentTarget.style.transform = 'translateY(-3px) scale(1.02)'}
              onMouseLeave={e => e.currentTarget.style.transform = 'none'}>
              <div className="font-bold text-sm">{p.name}</div>
              <div className="flex gap-1 mt-1">
                <div className="w-4 h-4 rounded" style={{ background: p.accent }}></div>
                <div className="w-4 h-4 rounded" style={{ background: p.card }}></div>
                <div className="w-4 h-4 rounded" style={{ background: p.bg }}></div>
              </div>
            </button>
          ))}
        </div>
      </div>

      <div className="card">
        <h3 className="font-semibold mb-3">Custom Colors</h3>
        <div className="grid grid-cols-2 md:grid-cols-3 gap-3 text-sm">
          <div><label className="text-slate-400 block mb-1">Accent Color</label><input type="color" value={theme.accent_color} onChange={e => updateField('accent_color', e.target.value)} className="w-full h-9 rounded-lg cursor-pointer" /></div>
          <div><label className="text-slate-400 block mb-1">Background</label><input type="color" value={theme.background} onChange={e => updateField('background', e.target.value)} className="w-full h-9 rounded-lg cursor-pointer" /></div>
          <div><label className="text-slate-400 block mb-1">Card Background</label><input type="color" value={theme.card_bg} onChange={e => updateField('card_bg', e.target.value)} className="w-full h-9 rounded-lg cursor-pointer" /></div>
          <div><label className="text-slate-400 block mb-1">Text Color</label><input type="color" value={theme.text_color} onChange={e => updateField('text_color', e.target.value)} className="w-full h-9 rounded-lg cursor-pointer" /></div>
          <div><label className="text-slate-400 block mb-1">Secondary Text</label><input type="color" value={theme.text_secondary} onChange={e => updateField('text_secondary', e.target.value)} className="w-full h-9 rounded-lg cursor-pointer" /></div>
          <div><label className="text-slate-400 block mb-1">Border Color</label><input type="color" value={theme.border_color} onChange={e => updateField('border_color', e.target.value)} className="w-full h-9 rounded-lg cursor-pointer" /></div>
        </div>
      </div>

      <div className="card">
        <h3 className="font-semibold mb-3">Wallpaper</h3>
        <div className="flex gap-3 items-start">
          <div className="flex-1">
            <input type="file" accept="image/*" onChange={handleWallpaper} className="text-sm" />
            <div className="mt-2 text-sm text-slate-400">Upload a background image (PNG/JPG). Leave empty for solid color.</div>
            <div className="mt-2">
              <label className="text-slate-400 text-sm">Opacity: {Math.round((theme.wallpaper_opacity || 0.3) * 100)}%</label>
              <input type="range" min="0" max="1" step="0.05" value={theme.wallpaper_opacity || 0.3} onChange={e => updateField('wallpaper_opacity', parseFloat(e.target.value))} className="w-full" />
            </div>
          </div>
          {wallpaperPreview && (
            <div className="w-32 h-20 rounded-xl border border-slate-600 overflow-hidden pop">
              <img src={wallpaperPreview} alt="preview" className="w-full h-full object-cover" />
            </div>
          )}
        </div>
      </div>

      <div className="card">
        <h3 className="font-semibold mb-3">Typography & Layout</h3>
        <div className="grid grid-cols-2 md:grid-cols-3 gap-3 text-sm">
          <div>
            <label className="text-slate-400 block mb-1">Font Size</label>
            <select className="px-2 py-1.5 w-full" value={theme.font_size} onChange={e => updateField('font_size', e.target.value)}>
              <option value="small">Small</option>
              <option value="medium">Medium</option>
              <option value="large">Large</option>
            </select>
          </div>
          <div>
            <label className="text-slate-400 block mb-1">Card Style</label>
            <select className="px-2 py-1.5 w-full" value={theme.card_style} onChange={e => updateField('card_style', e.target.value)}>
              <option value="solid">Solid</option>
              <option value="glass">Glass (blur)</option>
              <option value="bordered">Bordered</option>
            </select>
          </div>
          <div>
            <label className="text-slate-400 block mb-1">Border Radius</label>
            <input type="number" className="px-2 py-1.5 w-full" value={theme.border_radius} onChange={e => updateField('border_radius', parseInt(e.target.value))} />
          </div>
          <div>
            <label className="text-slate-400 block mb-1">Sidebar Position</label>
            <select className="px-2 py-1.5 w-full" value={theme.sidebar_position} onChange={e => updateField('sidebar_position', e.target.value)}>
              <option value="left">Left</option>
              <option value="right">Right</option>
              <option value="top">Top (horizontal)</option>
            </select>
          </div>
        </div>
      </div>

      <div className="card">
        <h3 className="font-semibold mb-2">Live Preview</h3>
        <div className="p-4 rounded-xl" style={{ background: theme.background, color: theme.text_color, border: '1px solid ' + theme.border_color }}>
          <div className="text-lg font-bold" style={{ color: theme.accent_color }}>Accent Text</div>
          <div style={{ background: theme.card_bg, padding: '8px', borderRadius: theme.border_radius + 'px', marginTop: '8px' }}>
            <div style={{ color: theme.text_color }}>Card content text</div>
            <div style={{ color: theme.text_secondary, fontSize: '0.875rem' }}>Secondary text</div>
          </div>
        </div>
      </div>

      <button className="btn btn-primary" onClick={saveTheme}>Save Theme</button>
    </div>
  );
}

// ─── Device Theme Editor ──────────────────────────────────
function DeviceThemeEditor() {
  const [theme, setTheme] = useState(null);
  const [presets] = useState([
    {id:'default', name:'Default', bg:'#000000', text:'#FFFFFF', accent:'#07FF', secondary:'#8410', warning:'#FD20', success:'#07E0', danger:'#F800', headerBg:'#0010'},
    {id:'dark-blue', name:'Dark Blue', bg:'#000010', text:'#FFFFFF', accent:'#00BFFF', secondary:'#404060', warning:'#FF8C00', success:'#00FF7F', danger:'#FF4500', headerBg:'#000030'},
    {id:'green', name:'Matrix', bg:'#000000', text:'#00FF00', accent:'#00FF00', secondary:'#004000', warning:'#FFFF00', success:'#00FF00', danger:'#FF0000', headerBg:'#001000'},
    {id:'amber', name:'Amber', bg:'#0a0800', text:'#FFB000', accent:'#FFB000', secondary:'#403000', warning:'#FF6600', success:'#FFB000', danger:'#FF0000', headerBg:'#1a1400'},
    {id:'white', name:'White', bg:'#FFFFFF', text:'#000000', accent:'#0000FF', secondary:'#808080', warning:'#FF8800', success:'#008800', danger:'#FF0000', headerBg:'#DDDDDD'},
  ]);

  const [display, setDisplay] = useState({ font_face: 'pixel', wallpaper_opacity: 150, wallpaper: false, fonts: [] });
  const [wallpaperPreview, setWallpaperPreview] = useState(null);
  const [uploading, setUploading] = useState(false);

  useEffect(() => {
    api('/config/device-theme').then(d => setTheme(d)).catch(() => {});
    api('/config/display').then(d => setDisplay(d)).catch(() => {});
    api('/config/wallpaper').then(d => {
      if (d.present && d.data) setWallpaperPreview('data:image/png;base64,' + d.data);
    }).catch(() => {});
  }, []);

  const saveDisplay = async (patch) => {
    setDisplay(prev => ({ ...prev, ...patch }));
    try {
      const d = await api('/config/display', { method: 'PUT', body: JSON.stringify(patch) });
      if (d.display) setDisplay(prev => ({ ...prev, ...d.display, wallpaper: d.wallpaper }));
      notify('Display setting applied');
    } catch (e) { notify('Error: ' + e.message, 'error'); }
  };

  const uploadWallpaper = (file) => {
    if (!file) return;
    setUploading(true);
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = async () => {
      try {
        // Downscale in the browser (2x the panel) so the upload stays small.
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 320;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(canvas.width / img.width, canvas.height / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
        await api('/config/wallpaper', { method: 'POST', body: JSON.stringify({ image: dataUrl }) });
        setWallpaperPreview(dataUrl);
        setDisplay(prev => ({ ...prev, wallpaper: true }));
        notify('Wallpaper uploaded & pushed to device');
      } catch (e) { notify('Error: ' + e.message, 'error'); }
      finally { URL.revokeObjectURL(url); setUploading(false); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); setUploading(false); notify('Could not read that image', 'error'); };
    img.src = url;
  };

  const clearWallpaper = async () => {
    try {
      await api('/config/wallpaper', { method: 'DELETE' });
      setWallpaperPreview(null);
      setDisplay(prev => ({ ...prev, wallpaper: false }));
      notify('Wallpaper cleared');
    } catch (e) { notify('Error: ' + e.message, 'error'); }
  };

  const applyPreset = (p) => {
    const newTheme = {...theme, bg_color: p.bg, text_color: p.text, accent_color: p.accent, secondary_color: p.secondary, warning_color: p.warning, success_color: p.success, danger_color: p.danger, header_bg: p.headerBg};
    setTheme(newTheme);
    api('/config/device-theme', {method:'PUT', body: JSON.stringify(newTheme)}).then(() => notify('Theme applied: ' + p.name)).catch(e => notify('Error: ' + e.message, 'error'));
  };

  const updateField = (key, value) => {
    setTheme(prev => ({...prev, [key]: value}));
  };

  const saveTheme = () => {
    api('/config/device-theme', {method:'PUT', body: JSON.stringify(theme)}).then(() => notify('Device theme saved & pushed!')).catch(e => notify('Error: ' + e.message, 'error'));
  };

  if (!theme) return <div className="text-slate-400 flex items-center gap-2"><span className="pulse-dot on"></span> Loading...</div>;

  return (
    <div className="space-y-4 stagger">
      <SectionHeader title="Device Display Theme (TFT)" sub="Configure colors for the ESP32 TFT display. Changes are pushed to the device immediately." />
      <div className="card">
        <h3 className="font-semibold mb-3">Color Presets</h3>
        <div className="grid grid-cols-2 md:grid-cols-5 gap-2">
          {presets.map(p => (
            <button key={p.id} onClick={() => applyPreset(p)}
              className="p-3 rounded-xl border-2 text-left border-slate-600 hover:border-slate-400"
              style={{ background: p.bg, color: p.text, transition: 'transform .2s, border-color .2s' }}
              onMouseEnter={e => e.currentTarget.style.transform = 'translateY(-3px) scale(1.03)'}
              onMouseLeave={e => e.currentTarget.style.transform = 'none'}>
              <div className="font-bold text-sm">{p.name}</div>
              <div className="flex gap-1 mt-1">
                <div className="w-4 h-4 rounded" style={{ background: p.accent }}></div>
                <div className="w-4 h-4 rounded" style={{ background: p.secondary }}></div>
                <div className="w-4 h-4 rounded" style={{ background: p.bg, border: '1px solid ' + p.text }}></div>

// ─── Toast stack ──────────────────────────────────────────
function Toasts() {
  const [items, setItems] = useState([]);
  useEffect(() => {
    const h = (e) => {
      const id = Date.now() + Math.random();
      setItems(list => [...list.slice(-3), { id, ...e.detail }]);
      setTimeout(() => setItems(list => list.map(t => t.id === id ? { ...t, leaving: true } : t)), 3200);
      setTimeout(() => setItems(list => list.filter(t => t.id !== id)), 3500);
    };
    window.addEventListener('db-toast', h);
    return () => window.removeEventListener('db-toast', h);
  }, []);
  return (
    <div className="fixed top-4 right-4 z-50 flex flex-col gap-2 w-80 max-w-[calc(100vw-2rem)]">
      {items.map(t => (
        <div key={t.id} className={'toast relative overflow-hidden rounded-xl px-4 py-3 text-sm font-medium flex items-start gap-3 ' + (t.leaving ? 'leaving' : '')}
          style={{ background: t.type === 'error' ? 'rgba(127,29,29,.85)' : 'rgba(6,78,59,.85)', border: '1px solid ' + (t.type === 'error' ? 'rgba(248,113,113,.4)' : 'rgba(52,211,153,.4)'), color: '#fff' }}>
          <span>{t.type === 'error' ? '⚠️' : '✅'}</span>
          <span className="break-words min-w-0">{t.msg}</span>
          <span className="absolute bottom-0 left-0 h-0.5 w-full origin-left" style={{ background: t.type === 'error' ? '#f87171' : '#34d399', animation: 'bar 3.2s linear forwards' }}></span>
        </div>
      ))}
    </div>
  );
}

function LedController() {
  const [led, setLed] = useState({
    power: true, brightness: 140, count: 16, effect: 'auto', mode: 'auto',
    color: '#7828C8', color2: '#00C8DC', speed: 128, intensity: 128,
  });
  const [effects, setEffects] = useState([]);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    api('/config/led').then(d => {
      if (d.led) setLed(d.led);
      if (d.effects) setEffects(d.effects);
    }).catch(e => notify('Failed to load LED settings: ' + e.message, 'error'));
  }, []);

  const pushLed = async (patch) => {
    const next = { ...led, ...patch };
    setLed(next);
    setSaving(true);
    try {
      const res = await api('/config/led', { method: 'PUT', body: JSON.stringify(patch) });
      if (res.led) setLed(res.led);
    } catch (e) {
      notify('LED update failed: ' + e.message, 'error');
    } finally {

                {m === 'music' ? '🎵 Music' : m === 'ambient' ? '✨ Ambient' : '⚡ Auto'}

        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

function hexToRgb(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
  return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)].join(',') : '6,182,212';
}

function App() {
  const [tab, setTab] = useState('dashboard');
  const [state, setState] = useState({});
  const [metrics, setMetrics] = useState({});
  const [theme, setTheme] = useState(null);
  const refreshState = () => { api('/companion/device-state').then(d => setState(s => ({...s, ...d, m_art: s.m_art, batt_v: s.batt_v, batt: s.batt}))).catch(() => {}); api('/desktop/music/status').then(d => setState(s => ({...s, m_title: d.title, m_artist: d.artist, m_art: d.album_art_url || s.m_art, m_play: d.playing ? 1 : 0, m_prog: Math.floor(d.progress_ms/1000), m_dur: Math.floor(d.duration_ms/1000)}))).catch(() => {}); };

  // Load and apply theme
  useEffect(() => {
    api('/config/theme').then(d => {
      setTheme(d);
      window.applyTheme(d);
    }).catch(() => {});
  }, []);

  window.applyTheme = (t) => {
    const bg = t.background || '#070b14';
    const cardBg = t.card_bg || '#111a2e';
    const text = t.text_color || '#e2e8f0';
    const textSec = t.text_secondary || '#94a3b8';
    const border = t.border_color || '#25324d';
    const accent = t.accent_color || '#06b6d4';
    const radius = (t.border_radius || 16) + 'px';

    const root = document.documentElement;
    root.style.setProperty('--bg', bg);
    root.style.setProperty('--card-bg', cardBg);
    root.style.setProperty('--text', text);
    root.style.setProperty('--text-secondary', textSec);
    root.style.setProperty('--border', border);
    root.style.setProperty('--accent', accent);
    root.style.setProperty('--accent-rgb', hexToRgb(accent));
    root.style.setProperty('--radius', radius);

    document.body.style.background = bg;
    document.body.style.color = text;
    if (t.wallpaper) {
      document.body.style.backgroundImage = `url(${t.wallpaper})`;
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center';
      document.body.style.backgroundAttachment = 'fixed';
    } else {
      document.body.style.backgroundImage = 'none';
    }

    // Text/accent overrides for Tailwind utility classes (surfaces are handled by CSS variables)
    let styleTag = document.getElementById('theme-override');
    if (!styleTag) {
      styleTag = document.createElement('style');
      styleTag.id = 'theme-override';
      document.head.appendChild(styleTag);
    }
    styleTag.textContent = `
      .text-slate-400 { color: ${textSec} !important; }
      .text-slate-500 { color: ${textSec} !important; opacity: 0.7; }
      .text-white, .text-slate-200, .text-slate-300 { color: ${text} !important; }
      .text-cyan-400, .text-cyan-300 { color: ${accent} !important; }
      .border-slate-700, .border-slate-600 { border-color: ${border} !important; }
    `;
  };

  useWebSocket((msg) => {
    if (msg.channel === 'deskbuddy_state' || msg.type === 'deskbuddy_state') {
      const d = msg.data || msg;
      setState(prev => ({
        ...prev,
        dev_online: d.device?.online ? 1 : (d.dev_online ?? prev.dev_online),
        m_title: d.music?.title ?? d.m_title ?? prev.m_title,
        m_artist: d.music?.artist ?? d.m_artist ?? prev.m_artist,
        m_art: d.music?.album_art_url ?? d.m_art ?? prev.m_art,
        m_play: d.music?.playing ? 1 : (d.m_play ?? prev.m_play),
        m_prog: d.music?.progress_ms ? Math.floor(d.music.progress_ms / 1000) : (d.m_prog ?? prev.m_prog),
        m_dur: d.music?.duration_ms ? Math.floor(d.music.duration_ms / 1000) : (d.m_dur ?? prev.m_dur),
        act: d.activity ?? prev.act,
        expr: d.expression ?? prev.expr,
        sleep: d.sleep_stage ?? prev.sleep,
        app: d.app ?? prev.app,
        win: d.window ?? prev.win,
        idle: d.idle_seconds ?? prev.idle,
        audio: d.audio_active ? 1 : (d.audio ?? prev.audio),
        cpu: d.metrics?.cpu_percent ?? d.cpu ?? prev.cpu,
        mem: d.metrics?.memory_percent ?? d.mem ?? prev.mem,
        gpu: d.metrics?.gpu_percent ?? d.gpu ?? prev.gpu,
        ctemp: d.metrics?.cpu_temp_c ?? d.ctemp ?? prev.ctemp,
        tz: d.metrics?.thermal_zone_c ?? d.tz ?? prev.tz,
        gtemp: d.metrics?.gpu_temp_c ?? d.gtemp ?? prev.gtemp,
        gmem: d.metrics?.gpu_memory_percent ?? d.gmem ?? prev.gmem,
        gvram: d.metrics?.gpu_memory_total_mb ?? d.gvram ?? prev.gvram,
        gfan: d.metrics?.gpu_fan_percent ?? d.gfan ?? prev.gfan,
        env_t: d.environment?.temperature ?? d.env_t ?? prev.env_t,
        env_h: d.environment?.humidity ?? d.env_h ?? prev.env_h,
        env_p: d.environment?.pressure ?? d.env_p ?? prev.env_p,
        batt: d.device?.battery ?? d.batt ?? prev.batt,
        batt_v: d.device?.battery_voltage ?? d.batt_v ?? prev.batt_v,
        mic: d.device?.mic_level ?? d.mic ?? prev.mic,
        unread: d.unread ?? prev.unread,
        clock: d.clock ?? prev.clock,
        date: d.date ?? prev.date,
        dow: d.dow ?? prev.dow,
        page: d.device?.page ?? d.page ?? prev.page,
        lyr_cur: d.lyrics?.current ?? d.lyr_cur ?? prev.lyr_cur,
        lyr_prev: d.lyrics?.prev ?? d.lyr_prev ?? prev.lyr_prev,
        lyr_next: d.lyrics?.next ?? d.lyr_next ?? prev.lyr_next,
        lyr_ok: d.lyrics?.available ? 1 : (d.lyr_ok ?? prev.lyr_ok),
        lyr_sync: d.lyrics?.synced ? 1 : (d.lyr_sync ?? prev.lyr_sync),
        lyr_idx: d.lyrics?.index ?? d.lyr_idx ?? prev.lyr_idx,
        lyr_tot: d.lyrics?.total ?? d.lyr_tot ?? prev.lyr_tot,
      }));
    }
  });

  useEffect(() => {
    const poll = () => {
      api('/system/metrics').then(d => setMetrics(d)).catch(() => {});
      api('/companion/device-state').then(d => setState(s => ({...s, ...d, m_art: s.m_art, batt_v: s.batt_v, batt: s.batt}))).catch(() => {});
    };
    poll();
    const id = setInterval(poll, 1000);
    return () => clearInterval(id);
  }, []);

  return (
    <div className="min-h-screen">
      <Toasts />
      <header className="sticky top-0 z-40 px-4 md:px-6 py-3 flex items-center justify-between border-b"
        style={{ background: 'color-mix(in srgb, var(--bg) 70%, transparent)', backdropFilter: 'blur(18px) saturate(150%)', WebkitBackdropFilter: 'blur(18px) saturate(150%)', borderColor: 'color-mix(in srgb, var(--border) 70%, transparent)' }}>
        <div className="flex items-center gap-3">
          <span className="text-2xl float wiggle inline-block cursor-default">🤖</span>
          <span className="text-lg font-extrabold tracking-tight">DeskBuddy <span className="gradient-text">Control Panel</span></span>
        </div>
        <div className="flex items-center gap-2 text-sm px-3 py-1.5 rounded-full"
          style={{ background: 'rgba(148,163,184,.1)', border: '1px solid rgba(148,163,184,.15)' }}>
          <span className={'pulse-dot ' + (state.dev_online ? 'on' : 'off')}></span>
          <span className="text-slate-300">{state.dev_online ? 'Device Online' : 'Device Offline'}</span>
        </div>
      </header>
      <div className="flex flex-col md:flex-row">
        <nav className="flex md:flex-col gap-1 p-2 md:p-3 overflow-x-auto md:overflow-visible md:w-56 shrink-0 md:sticky md:top-[61px] md:h-[calc(100vh-61px)] md:overflow-y-auto border-b md:border-b-0 md:border-r"
          style={{ background: 'color-mix(in srgb, var(--bg) 45%, transparent)', backdropFilter: 'blur(10px)', WebkitBackdropFilter: 'blur(10px)', borderColor: 'color-mix(in srgb, var(--border) 60%, transparent)' }}>
          {TABS.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} className={'nav-item ' + (tab === t.id ? 'active' : '')}>
              <span className="nav-icon">{t.icon}</span> {t.label}
            </button>
          ))}
        </nav>
        <main className="flex-1 p-4 md:p-8 max-w-6xl w-full min-w-0">
          <div key={tab} className="page-enter">
            {tab === 'dashboard' && <Dashboard state={state} metrics={metrics} setState={setState} refreshState={refreshState} />}
            {tab === 'expressions' && <Expressions />}
            {tab === 'buttons' && <ButtonMappings />}
            {tab === 'led' && <LedController />}
            {tab === 'notifications' && <Notifications />}
            {tab === 'sensors' && <SensorGraphs />}
            {tab === 'inspection' && <InspectionModels />}
            {tab === 'gaming' && <GamingMode />}
            {tab === 'theme' && <ThemeEditor />}
            {tab === 'device-theme' && <DeviceThemeEditor />}
            {tab === 'settings' && <Settings />}
          </div>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
