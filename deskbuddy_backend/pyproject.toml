[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deskbuddy-backend"
version = "1.0.0"
description = "Unified Desktop Companion Backend - DeskMate + deskey-v2 + Hermes + StatNode + yt-music-companion"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "DeskBuddy Team", email = "team@deskbuddy.local"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.2",
    "pydantic-settings==2.6.1",
    "httpx==0.28.0",
    "websockets==13.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.29.0",
    "redis==5.1.0",
    "psutil==7.2.2",
    "nvidia-ml-py==12.560.30",
    "prometheus-client==0.20.0",
    "py-cpuinfo==9.0.0",
    "apprise==1.6.0",
    "aiohttp==3.10.0",
    "ytmusicapi==1.6.0",
    "yt-dlp==2024.11.18",
    "hidapi==0.14.0",
    "pyserial==3.5",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.20",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",
    "apscheduler==3.11.0",
    "orjson==3.10.0",
    "python-dateutil==2.9.0",
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    # Voice assistant: local Whisper STT + edge-tts neural TTS
    "faster-whisper>=1.2.0",
    "edge-tts>=7.0.0",
    "soundfile>=0.13.0",
    "onnxruntime>=1.17.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "aiosqlite==0.20.0",
    "black==24.10.0",
    "ruff==0.8.0",
    "mypy==1.13.0",
    "pre-commit==3.8.0",
]
windows = [
    "pywin32==308",
    "wmi==1.5.1",
]
linux = [
    "evdev==1.8.0",
    "dbus-python==1.3.2",
]
macos = [
    "rumps==0.4.0",
    "pyobjc-framework-ScriptingBridge",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-dir]
"" = "."

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "PTH", "T20", "SIM", "TID", "ARG", "ERA", "PL", "TRY", "NPY", "RSE", "RET", "FLY", "INP", "TCH", "PTH", "PIC", "C90", "PLW", "EXE", "ISC", "ICN", "PT", "PER", "PIE", "T10", "ERA", "PLE", "PLR", "RSE", "TRY", "NPY", "COM", "ARG", "PTH", "PL", "TRY", "NPY", "ARG", "PTH", "PL", "TRY", "NPY", "ARG", "PTH", "PL", "TRY", "NPY"]
ignore = ["E501", "B008", "C901"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.alembic]
script_location = "alembic"
version_path_separator = "os"
file_template = "%%04d_%%(slug)s"
