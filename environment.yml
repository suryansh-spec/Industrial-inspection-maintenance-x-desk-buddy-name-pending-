name: inspection
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # core training stack (conda build — pre-compiled, faster)
  - numpy=2.1.*
  - scipy=1.14.*
  - scikit-learn=1.5.*
  - matplotlib=3.9.*
  - tqdm=4.67.*
  - pandas=2.2.*
  - joblib=1.4.*
  - jupyterlab=4.3.*
  # audio (conda-forge versions are reliable)
  # libsndfile >= 1.2 (soundfile >= 0.13) is required to decode edge-tts MP3.
  - pysoundfile>=0.13
  - librosa=0.10.*
  # pip-only deps (installed last)
  - pip
  - pip:
      - torch==2.5.1
      - torchvision==0.20.1
      # DeskBuddy voice assistant
      - faster-whisper>=1.2.0
      - edge-tts>=7.0.0
      - onnxruntime>=1.17.0