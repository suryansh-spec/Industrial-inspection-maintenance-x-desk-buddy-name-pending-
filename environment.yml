name: inspection
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # Core scientific & ML stack
  - scikit-learn=1.5.*
  - matplotlib=3.9.*
  - tqdm=4.67.*
  - pandas=2.2.*
  - joblib=1.4.*
  - jupyterlab=4.3.*
  # Audio (libsndfile >= 1.2 is required to decode edge-tts MP3)
  - pysoundfile>=0.13
  - librosa=0.10.*
  - pip
  - pip:
      - -r deskbuddy_backend/requirements.txt
