[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-fault-classification"
version = "1.0.0"
description = "CNN-based bearing fault diagnosis on CWRU dataset"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]